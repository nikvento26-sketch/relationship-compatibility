<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relationship Compatibility</title>


<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap');

:root{
  --bg:#f5f5f7;
  --surface:rgba(255,255,255,.72);
  --surface-solid:#fff;
  --text:#1d1d1f;
  --secondary:#6e6e73;
  --tertiary:#86868b;
  --line:rgba(0,0,0,.08);
  --blue:#0071e3;
  --blue-soft:#e8f2ff;
  --green:#34c759;
  --orange:#ff9500;
  --red:#ff3b30;
  --shadow:0 12px 40px rgba(0,0,0,.07);
  --shadow-soft:0 5px 20px rgba(0,0,0,.05);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 0%,rgba(0,113,227,.07),transparent 28%),
    radial-gradient(circle at 85% 8%,rgba(175,82,222,.07),transparent 25%),
    var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.container{
  max-width:1240px;
  margin:0 auto;
  padding:42px 28px 80px;
}

header{
  border:0;
  background:transparent;
  padding:24px 4px 30px;
  margin-bottom:8px;
}

header h1{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;
  font-size:42px;
  line-height:1.08;
  letter-spacing:-.045em;
  font-weight:700;
  margin:0 0 8px;
}

.subtitle{
  color:var(--secondary);
  font-size:17px;
  letter-spacing:-.01em;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-top:22px;
}

button{
  appearance:none;
  border:1px solid rgba(0,0,0,.09);
  background:rgba(255,255,255,.75);
  color:var(--text);
  border-radius:980px;
  padding:9px 16px;
  cursor:pointer;
  font:500 13px -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,sans-serif;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
  transition:.2s ease;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

button:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 15px rgba(0,0,0,.08);
  background:#fff;
}

button:active{transform:scale(.98)}

button.primary{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
  box-shadow:0 4px 12px rgba(0,113,227,.22);
}

button.primary:hover{background:#0077ed}

button.danger{
  color:var(--red);
  background:#fff;
}

.tabs{
  display:flex;
  gap:3px;
  overflow:auto;
  padding:5px;
  margin:10px 0 24px;
  border:1px solid rgba(0,0,0,.06);
  border-radius:14px;
  background:rgba(255,255,255,.58);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  box-shadow:var(--shadow-soft);
}

.tab{
  flex:0 0 auto;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--secondary);
  padding:9px 14px;
  box-shadow:none;
}

.tab:hover{
  background:rgba(0,0,0,.04);
  transform:none;
}

.tab.active{
  color:var(--text);
  background:#fff;
  font-weight:600;
  border:0;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.card{
  background:var(--surface);
  border:1px solid rgba(255,255,255,.8);
  border-radius:24px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
}

.card h2{
  font-size:22px;
  letter-spacing:-.025em;
  margin:0 0 6px;
  font-weight:650;
}

.card h3{
  font-size:16px;
  letter-spacing:-.015em;
  margin:0 0 10px;
  font-weight:650;
}

.section-note{
  font-size:13px;
  color:var(--secondary);
  margin:0 0 18px;
}

.grid{
  display:grid;
  gap:16px;
}

.grid.kpis{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.kpi{
  position:relative;
  overflow:hidden;
  min-height:132px;
  padding:21px;
  border:1px solid rgba(255,255,255,.9);
  border-radius:20px;
  background:rgba(255,255,255,.78);
  box-shadow:var(--shadow-soft);
}

.kpi:after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border-radius:50%;
  right:-50px;
  top:-55px;
  background:rgba(0,113,227,.07);
}

.kpi .label{
  position:relative;
  z-index:1;
  color:var(--secondary);
  font-size:12px;
  font-weight:500;
  margin-bottom:9px;
}

.kpi .value{
  position:relative;
  z-index:1;
  font-size:30px;
  line-height:1.1;
  letter-spacing:-.035em;
  font-weight:700;
}

.table-wrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(255,255,255,.62);
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  background:transparent;
}

th,td{
  border-bottom:1px solid rgba(0,0,0,.055);
  padding:11px 12px;
  text-align:left;
  vertical-align:middle;
  white-space:nowrap;
}

th{
  background:rgba(245,245,247,.75);
  color:var(--secondary);
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
  position:sticky;
  top:0;
  z-index:2;
}

tr:last-child td{border-bottom:0}

td input,td select,td textarea{
  width:100%;
  min-width:75px;
  border:1px solid transparent;
  background:transparent;
  border-radius:9px;
  padding:7px 8px;
  color:var(--text);
  font:inherit;
  transition:.15s ease;
}

td input:hover,td select:hover,td textarea:hover{
  background:rgba(0,0,0,.025);
}

td input:focus,td select:focus,td textarea:focus{
  outline:none;
  border-color:rgba(0,113,227,.35);
  background:#fff;
  box-shadow:0 0 0 3px rgba(0,113,227,.08);
}

.empty{
  color:#a1a1a6;
  font-style:italic;
}

.chart-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.chart-box{
  height:380px;
  position:relative;
  padding-top:5px;
}

.analytics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.insight{
  border:1px solid rgba(0,0,0,.06);
  border-radius:18px;
  padding:17px;
  background:rgba(255,255,255,.7);
  box-shadow:0 4px 18px rgba(0,0,0,.035);
}

.insight .title{
  color:var(--secondary);
  font-size:12px;
  margin-bottom:7px;
}

.insight .text{
  font-size:14px;
  font-weight:600;
  line-height:1.45;
}

.small{
  color:var(--secondary);
  font-size:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:4px 9px;
  border-radius:999px;
  background:var(--blue-soft);
  color:var(--blue);
  font-size:11px;
  font-weight:600;
}

.report{
  max-width:900px;
  margin:0 auto;
}

@media(max-width:900px){
  .container{padding:26px 18px 60px}
  header h1{font-size:34px}
  .grid.kpis{grid-template-columns:repeat(2,1fr)}
  .chart-grid,.analytics{grid-template-columns:1fr}
}

@media(max-width:520px){
  header h1{font-size:30px}
  .subtitle{font-size:15px}
  .container{padding:20px 12px 45px}
  .card{padding:17px;border-radius:19px}
  .grid.kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{min-height:112px;padding:15px}
  .kpi .value{font-size:24px}
  .tabs{border-radius:12px}
}

.chart-grid,.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}
.chart-card{
  min-width:0;
}
.chart-stage{
  height:390px;
  margin-top:14px;
  border-radius:18px;
  background:rgba(248,248,250,.7);
  border:1px solid rgba(0,0,0,.05);
  overflow:hidden;
}
.chart-stage svg{
  width:100%;
  height:100%;
  display:block;
}
.chart-legend{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:8px;
  color:var(--secondary);
  font-size:12px;
}
.chart-legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.chart-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
}
@media(max-width:900px){
  .chart-grid,.grid2{grid-template-columns:1fr}
}

/* Apple-style profile cards */
.profile-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:18px;
}
.profile-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:18px;
}
.profile-card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.9);
  border-radius:26px;
  background:rgba(255,255,255,.78);
  box-shadow:0 14px 45px rgba(0,0,0,.07);
  backdrop-filter:blur(24px) saturate(140%);
}
.profile-cover{
  height:105px;
  background:
    radial-gradient(circle at 20% 10%,rgba(0,113,227,.28),transparent 38%),
    radial-gradient(circle at 90% 0%,rgba(175,82,222,.22),transparent 35%),
    linear-gradient(135deg,#eef4ff,#f7f7fa 65%,#eeeef2);
}
.profile-body{
  padding:0 20px 20px;
}
.profile-avatar-wrap{
  margin-top:-48px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.profile-avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.96);
  background:linear-gradient(135deg,#e8e8ed,#f9f9fb);
  box-shadow:0 10px 25px rgba(0,0,0,.12);
  object-fit:cover;
}
.profile-avatar.placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#1d1d1f;
  font-size:28px;
  font-weight:700;
  letter-spacing:-.04em;
}
.profile-photo-actions{
  display:flex;
  gap:7px;
  margin-bottom:5px;
}
.profile-photo-btn{
  border-radius:999px;
  padding:7px 11px;
  font-size:11px;
}
.profile-name{
  font-size:24px;
  line-height:1.15;
  letter-spacing:-.035em;
  font-weight:700;
  margin-top:14px;
}
.profile-meta{
  color:var(--secondary);
  margin-top:4px;
  font-size:13px;
}
.profile-pills{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin:12px 0 16px;
}
.profile-pill{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  background:#f5f5f7;
  color:#5f5f63;
  font-size:11px;
  max-width:100%;
}
.profile-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}
.profile-info{
  padding:11px 12px;
  border-radius:14px;
  background:rgba(245,245,247,.75);
  min-height:70px;
}
.profile-info .label{
  font-size:10px;
  color:var(--tertiary);
  margin-bottom:4px;
  text-transform:uppercase;
  letter-spacing:.06em;
  font-weight:600;
}
.profile-info .value{
  font-size:12px;
  line-height:1.4;
  color:var(--text);
}
.profile-select{
  width:100%;
  padding:12px 14px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:13px;
  background:rgba(255,255,255,.85);
  font:600 14px inherit;
  color:var(--text);
  outline:none;
}
.compare-header{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:14px;
  align-items:end;
  margin-bottom:18px;
}
.compare-person{
  padding:16px;
  border-radius:20px;
  background:rgba(255,255,255,.72);
  border:1px solid rgba(255,255,255,.85);
}
.compare-person .mini{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:10px;
}
.compare-mini-avatar{
  width:54px;height:54px;border-radius:50%;object-fit:cover;
  border:2px solid #fff;box-shadow:0 5px 15px rgba(0,0,0,.10);
}
.compare-mini-placeholder{
  display:flex;align-items:center;justify-content:center;
  background:#f0f0f2;color:#1d1d1f;font-weight:700;
}
.compare-vs{
  font-weight:700;color:var(--tertiary);padding-bottom:15px;
}
.compare-table td,.compare-table th{white-space:normal}
.compare-score{
  font-size:18px;font-weight:700;letter-spacing:-.02em;
}
.compare-muted{color:#a1a1a6}
.compare-profile-row{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
@media(max-width:700px){
  .compare-header{grid-template-columns:1fr}
  .compare-vs{display:none}
  .compare-profile-row{grid-template-columns:1fr}
  .profile-info-grid{grid-template-columns:1fr}
}

/* Comparison analytics */
.compare-analysis-grid{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);
  gap:18px;
  margin-top:18px;
}
.compare-chart{
  height:430px;
  border-radius:20px;
  background:rgba(248,248,250,.7);
  border:1px solid rgba(0,0,0,.05);
  overflow:hidden;
}
.compare-chart svg{width:100%;height:100%;display:block}
.forecast-card{
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(245,247,250,.75));
}
.forecast-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:14px;
}
.forecast-metric{
  padding:13px;
  border-radius:15px;
  background:rgba(245,245,247,.78);
}
.forecast-metric .label{
  font-size:10px;
  color:var(--tertiary);
  text-transform:uppercase;
  letter-spacing:.05em;
  margin-bottom:5px;
  font-weight:600;
}
.forecast-metric .value{
  font-size:20px;
  font-weight:700;
  letter-spacing:-.03em;
}
.forecast-row{
  display:grid;
  grid-template-columns:90px 1fr 54px;
  align-items:center;
  gap:10px;
  margin-top:10px;
}
.forecast-row .bar{
  height:9px;
  background:#e8e8ed;
  border-radius:999px;
  overflow:hidden;
}
.forecast-row .fill{
  height:100%;
  border-radius:999px;
}
.forecast-footnote{
  font-size:11px;
  color:var(--secondary);
  line-height:1.45;
  margin-top:14px;
}
.scenario-list{
  display:grid;
  gap:8px;
  margin-top:12px;
}
.scenario-item{
  padding:11px 12px;
  border-radius:14px;
  background:rgba(245,245,247,.72);
}
.scenario-item .title{
  font-size:12px;
  font-weight:650;
}
.scenario-item .scores{
  margin-top:4px;
  font-size:11px;
  color:var(--secondary);
}
@media(max-width:900px){
  .compare-analysis-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .forecast-grid{grid-template-columns:1fr 1fr 1fr;gap:7px}
  .forecast-row{grid-template-columns:72px 1fr 46px}
}

/* Firebase + enhanced analytics */
.auth-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 2px;padding:10px 12px;border:1px solid rgba(0,0,0,.06);border-radius:14px;background:rgba(255,255,255,.55);backdrop-filter:blur(18px)}
.auth-user{display:flex;align-items:center;gap:10px;color:var(--secondary);font-size:12px}
.auth-user strong{color:var(--text)}
.auth-status{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border-radius:999px;background:#f5f5f7;color:var(--secondary)}
.auth-dot{width:7px;height:7px;border-radius:50%;background:#a1a1a6;display:inline-block}
.auth-dot.online{background:#34c759}
.auth-actions{display:flex;gap:7px;flex-wrap:wrap}
.auth-gate{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(245,245,247,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.auth-gate.open{display:flex}
.auth-card{width:min(440px,100%);padding:28px;border-radius:28px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);box-shadow:0 28px 80px rgba(0,0,0,.16)}
.auth-card h2{margin:0 0 6px;font-size:28px;letter-spacing:-.04em}
.auth-card p{margin:0 0 18px;color:var(--secondary);font-size:13px}
.auth-form{display:grid;gap:10px}
.auth-form input{width:100%;padding:12px 13px;border:1px solid rgba(0,0,0,.09);border-radius:12px;background:#fff;font:inherit;outline:none}
.auth-form input:focus{border-color:rgba(0,113,227,.35);box-shadow:0 0 0 3px rgba(0,113,227,.08)}
.auth-form-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.auth-message{font-size:12px;line-height:1.45;color:var(--secondary);min-height:18px}
.auth-message.error{color:#ff3b30}
.auth-message.ok{color:#34c759}
.profile-switcher{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:10px;align-items:end;margin-bottom:16px}
.profile-switcher select{width:100%;padding:11px 12px;border:1px solid rgba(0,0,0,.08);border-radius:12px;background:#fff;font:600 13px inherit;color:var(--text)}
.profile-analytics-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px;margin-top:18px}
.profile-radar-box,.profile-bar-box{height:420px;border:1px solid rgba(0,0,0,.05);border-radius:20px;background:rgba(248,248,250,.7);overflow:hidden}
.profile-radar-box svg,.profile-bar-box svg{display:block;width:100%;height:100%}
.profile-metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.profile-metric{padding:14px;border-radius:16px;background:rgba(245,245,247,.76)}
.profile-metric .label{font-size:10px;color:var(--tertiary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:600}
.profile-metric .value{font-size:20px;font-weight:700;letter-spacing:-.03em}
.profile-filter{width:100%;padding:10px 12px;border:1px solid rgba(0,0,0,.08);border-radius:11px;background:#fff;font:inherit;outline:none;margin-bottom:14px}
.profile-card.clickable{cursor:pointer;transition:.2s ease}
.profile-card.clickable:hover{transform:translateY(-2px);box-shadow:0 18px 50px rgba(0,0,0,.10)}
.profile-card.selected{box-shadow:0 0 0 3px rgba(0,113,227,.12),0 18px 50px rgba(0,0,0,.10)}
.multi-compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin-bottom:18px}
.multi-compare-grid .compare-person{min-width:0}
.multi-compare-grid select{width:100%;padding:12px 13px;border:1px solid rgba(0,0,0,.08);border-radius:12px;background:#fff;font:600 13px inherit}
.multi-compare-chart{height:460px;border-radius:20px;background:rgba(248,248,250,.7);border:1px solid rgba(0,0,0,.05);overflow:hidden}
.multi-compare-chart svg{width:100%;height:100%;display:block}
.compare-dataset-legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:9px;color:var(--secondary);font-size:12px}
.compare-dataset-legend span{display:inline-flex;align-items:center;gap:6px}
.compare-dataset-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.profile-analytics-grid{align-items:stretch}.profile-radar-box,.profile-bar-box{padding:8px 8px 2px}.profile-switcher select{min-width:260px}.multi-compare-chart .compare-dataset-legend{position:relative;z-index:2}.compare-dataset-legend{border-top:1px solid rgba(0,0,0,.05);padding-top:9px}.interactive-tip{font-size:11px;color:var(--secondary);margin-top:7px}
@media(max-width:900px){.profile-analytics-grid{grid-template-columns:1fr}.multi-compare-grid{grid-template-columns:1fr}.profile-switcher{grid-template-columns:1fr}}
@media(max-width:520px){.profile-metric-grid{grid-template-columns:1fr 1fr 1fr;gap:7px}.auth-card{padding:22px}.multi-compare-chart{height:400px}}


/* Minimal, responsive navigation */
#nav{display:grid;gap:6px;margin:8px 0 24px;padding:5px;border:1px solid rgba(0,0,0,.06);border-radius:16px;background:rgba(255,255,255,.62);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow-soft)}
.nav-group{display:flex;align-items:center;gap:5px;min-width:0}

function hasUsableDashboardData(candidate){
  if(!candidate || typeof candidate!=="object") return false;
  const required=["Instructions","Categories","Profiles","Score Matrix","Scenario Study","Monthly Trend","Future & Finance","Dashboard Setup","Spider Chart Data"];
  if(!required.every(k=>candidate[k] && Array.isArray(candidate[k].rows) && Array.isArray(candidate[k].headers))) return false;
  if(!candidate.Profiles.rows.some(r=>String(r?.[1]??"").trim())) return false;
  if(!candidate.Categories.rows.length) return false;
  if(!candidate["Spider Chart Data"].rows.length) return false;
  if(!candidate["Scenario Study"].rows.length) return false;
  if(!candidate["Future & Finance"].rows.length) return false;
  const spiderHasValues=candidate["Spider Chart Data"].rows.some(r=>r.slice(1).some(v=>v!==null&&v!==undefined&&String(v).trim()!==""));
  const scenarioHasValues=candidate["Scenario Study"].rows.some(r=>r.slice(1).some(v=>v!==null&&v!==undefined&&String(v).trim()!==""));
  if(!spiderHasValues && !scenarioHasValues) return false;
  return true;
}

}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function isBlank(v){return v===null||v===undefined||v==="";}
function valNum(v){let n=parseFloat(v);return Number.isFinite(n)?n:null;}
function showToast(message,type="ok"){
  let el=document.getElementById("appToast");
  if(!el){
    el=document.createElement("div");
    el.id="appToast";
    el.className="app-toast";
    document.body.appendChild(el);
  }
  el.textContent=message;
  el.className="app-toast "+type+" show";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.classList.remove("show"),2600);
}
async function saveData(silent=false){
  try{
    localStorage.setItem("relationshipDashboardData",JSON.stringify(db));
    let online=false;
    if(typeof window.firebaseCloudSave==="function" && window.firebaseConfigured && window.firebaseReady){
      online=await window.firebaseCloudSave(true);
    }
    if(!silent) showToast(online?"Saved to this browser and Firebase.":"Saved to this browser.","ok");
  }catch(err){
    console.error("Save failed",err);
    if(!silent) showToast("Save failed. Your current screen was not changed.","error");
  }
}
function resetToOriginalData(){
  const ok=confirm("Restore the original master data from your uploaded HTML?\n\nThis replaces the current local browser data.");
  if(!ok)return;
  db=cloneInitialData();
  localStorage.setItem("relationshipDashboardData",JSON.stringify(db));
  ensureProfileColumnsForAll();
  dashboardProfileName=profileNamesEnhanced()[0]||"";
  selectedProfileName=dashboardProfileName||null;
  render();
  showToast("Original master data restored.","ok");
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="relationship_dashboard_backup.json";a.click();URL.revokeObjectURL(a.href);
}
function importJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=()=>{try{db=JSON.parse(r.result);render();saveData(true);alert("Backup imported.");}catch(x){alert("Invalid JSON backup.");}};r.readAsText(f);
}
function setCell(sheet,r,c,value){
  if(sheet==="Profiles" && c===1){
    const oldName=String(db[sheet].rows[r][1]??"");
    const newName=String(value??"");
    if(oldName && db.__profilePhotos?.[oldName] && oldName!==newName){
      db.__profilePhotos[newName]=db.__profilePhotos[oldName];
      delete db.__profilePhotos[oldName];
    }
  }
  db[sheet].rows[r][c]=value;
  if(sheet==="Score Matrix") updateScoreRow(r);
  render(false);
}
function updateScoreRow(r){
  const row=db["Score Matrix"].rows[r], b=valNum(row[1]), a1=valNum(row[2]), a2=valNum(row[3]), p1=valNum(row[4]), p2=valNum(row[5]);
  row[6]=(a1!==null&&a2!==null)?Math.abs(a1-a2):"";
  row[7]=(p1!==null&&p2!==null)?Math.abs(p1-p2):"";
  row[8]=(b!==null&&a1!==null&&a2!==null)?((a1+a2)/2*b/10).toFixed(2):"";
  row[9]=(b!==null&&p1!==null&&p2!==null)?((p1+p2)/2*b/10).toFixed(2):"";
}
function addRow(sheet){
  const n=db[sheet].headers.length;
  const row=new Array(n).fill("");
  // Helpful defaults for common ID columns.
  const h=db[sheet].headers;
  const idIndex=h.findIndex(x=>/^(Profile ID|Category ID|Scenario ID)$/i.test(x||""));
  if(idIndex>=0){let prefix=sheet==="Profiles"?"P":sheet==="Categories"?"C":"S"; row[idIndex]=prefix+String(db[sheet].rows.length+1).padStart(2,"0");}
  db[sheet].rows.push(row); render();
}
function delRow(sheet,r){
  if(!confirm("Delete this row?"))return;
  if(sheet==="Profiles"){
    const name=String(db.Profiles.rows[r]?.[1]??"");
    if(name) delete db.__profilePhotos[name];
  }
  db[sheet].rows.splice(r,1);
  render();
}
function field(sheet,r,c){
  const v=db[sheet].rows[r][c], h=db[sheet].headers[c]||"";
  if(calcCols[sheet]?.includes(c)) return `<span class="calc">${esc(v)}</span>`;
  if(/Date|Birthday/i.test(h)) return `<input type="date" value="${esc(v)}" onchange="setCell('${sheet}',${r},${c},this.value)">`;
  if(/Score|Importance|Age|Manpower|Ready/i.test(h) && !/Notes|Description/i.test(h)) return `<input type="number" min="0" max="${/Importance|Score/i.test(h)?10:999}" step="1" value="${esc(v)}" onchange="setCell('${sheet}',${r},${c},this.value)">`;
  if(/Notes|Description|Personality|Interests|Strengths|Improve|Position|Target|Scenario|Topic|Occupation|Education|Category|Area|Dimension|Module|Analysis|Sheet/i.test(h))
    return `<textarea onchange="setCell('${sheet}',${r},${c},this.value)">${esc(v)}</textarea>`;
  return `<input value="${esc(v)}" onchange="setCell('${sheet}',${r},${c},this.value)">`;
}
function renderTable(sheet){
  const d=db[sheet]; if(!d)return "";
  return `<div class="toolbar"><div class="muted">${d.rows.length} row(s) • Blank cells are intentionally editable.</div><button class="primary small" onclick="addRow('${sheet}')">＋ Add Data</button></div>
  <div class="tablewrap"><table><thead><tr>${d.headers.map(h=>`<th>${esc(h)}</th>`).join("")}<th>Action</th></tr></thead><tbody>
  ${d.rows.map((row,r)=>`<tr>${d.headers.map((h,c)=>`<td>${field(sheet,r,c)}</td>`).join("")}<td class="row-actions"><button class="danger small" onclick="delRow('${sheet}',${r})">Delete</button></td></tr>`).join("")}
  </tbody></table></div>`;
}
function scores(){
  return db["Score Matrix"].rows.map(r=>{updateScoreRow(db["Score Matrix"].rows.indexOf(r));return r;});
}
function avg(arr){let a=arr.filter(x=>x!==null&&!Number.isNaN(x));return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;}

function profileRows(){
  return (db.Profiles?.rows || []).filter(r=>Array.isArray(r));
}
function profileByName(name){
  return profileRows().find(r=>String(r[1]??"")===String(name??"")) || null;
}
function profileInitials(name){
  const parts=String(name||"?").trim().split(/\s+/).filter(Boolean);
  if(!parts.length)return "?";
  return (parts[0][0]||"")+(parts.length>1?(parts[parts.length-1][0]||""):"");
}
function profilePhoto(name){
  const p=db.__profilePhotos?.[String(name||"")];
  return p && String(p).startsWith("data:image/") ? p : "";
}
function profilePhotoMarkup(row){
  const name=String(row?.[1]??"").trim();
  const photo=profilePhoto(name);
  if(photo) return `<img class="profile-avatar" src="${esc(photo)}" alt="${esc(name)}">`;
  return `<div class="profile-avatar placeholder">${esc(profileInitials(name))}</div>`;
}
function handleProfilePhoto(profileName, input){
  const file=input?.files?.[0];
  if(!file)return;
  if(!file.type.startsWith("image/")){
    alert("Please choose an image file.");
    input.value="";
    return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=600;
      const scale=Math.min(1,max/Math.max(img.width,img.height));
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(img.width*scale));
      canvas.height=Math.max(1,Math.round(img.height*scale));
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      db.__profilePhotos[profileName]=canvas.toDataURL("image/jpeg",.82);
      render();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
function removeProfilePhoto(profileName){
  delete db.__profilePhotos[profileName];
  render();
}

  return `<article class="profile-card">

      </div>

        <div class="profile-info"><div class="label">Interests</div><div class="value">${interests?esc(interests):"<span class='compare-muted'>Not added</span>"}</div></div>
        <div class="profile-info"><div class="label">Strengths</div><div class="value">${strengths?esc(strengths):"<span class='compare-muted'>Not added</span>"}</div></div>

      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px">

        <button class="danger small" onclick="delRow('Profiles',${index})">Delete</button>
      </div>
    </div>
  </article>`;
}function profilesPage(){

  return `<div class="card">
    <div class="profile-toolbar">
      <div><h2 style="margin-bottom:3px">Profiles</h2><div class="section-note" style="margin:0">Build a clean profile for each person. Add a photo and keep the detailed fields editable below.</div></div>

function profileNames(){
  return profileRows().map(r=>String(r[1]??"").trim()).filter(Boolean);
}
function setCompare(which,value){
  if(which==="a") compareA=value;
  else compareB=value;
  db.__comparison={a:compareA,b:compareB};
  render();
}
function getCompareSelections(){
  const names=profileNames();
  const saved=db.__comparison||{};
  compareA=names.includes(compareA)?compareA:(names.includes(saved.a)?saved.a:(names[0]||""));
  compareB=names.includes(compareB)?compareB:(names.includes(saved.b)?saved.b:(names.find(n=>n!==compareA)||names[1]||""));
  if(compareA===compareB && names.length>1) compareB=names.find(n=>n!==compareA)||"";
}
function compareValues(){
  const header=db["Spider Chart Data"]?.headers || [];
  const rows=db["Spider Chart Data"]?.rows || [];
  const ai=header.findIndex(h=>String(h??"").trim()===String(compareA??"").trim());
  const bi=header.findIndex(h=>String(h??"").trim()===String(compareB??"").trim());
  return rows.map(r=>{
    const name=String(r?.[0]??"").trim();
    if(!name)return null;
    return {name,a:ai>=0?valNum(r?.[ai]):null,b:bi>=0?valNum(r?.[bi]):null};
  }).filter(Boolean);
}
function compareMini(row){

  return `<div class="mini">${avatar}<div><b>${esc(name||"Not selected")}</b><div class="small">${esc(String(row?.[4]??""))}</div></div></div>`;
}

function compareRadarSVG(values){
  const data=values.filter(x=>x.a!==null || x.b!==null);
  if(!data.length) return "<div class='empty' style='padding:55px;text-align:center'>No score data available for this pair.</div>";
  const w=760,h=430,cx=380,cy=205,R=145,n=data.length;
  const angle=i=>(-Math.PI/2)+(i*2*Math.PI/n);
  const pt=(i,v)=>{
    const a=angle(i), rr=R*(Math.max(0,Math.min(10,v||0))/10);
    return [cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
  };
  const poly=(v)=>data.map((_,i)=>pt(i,v)).map(p=>p.join(",")).join(" ");
  const pts=(k)=>data.map((d,i)=>pt(i,d[k] ?? 0)).map(p=>p.join(",")).join(" ");
  let s=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  [2,4,6,8,10].forEach(v=>{
    s+=`<polygon points="${poly(v)}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="${v===10?1.2:1}"/>`;
  });
  data.forEach((d,i)=>{
    const [x,y]=pt(i,10);
    const a=angle(i), lx=cx+(R+28)*Math.cos(a), ly=cy+(R+28)*Math.sin(a);
    let anchor="middle";
    if(lx<cx-12) anchor="end";
    if(lx>cx+12) anchor="start";
    s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(0,0,0,.06)"/>`;
    s+=`<text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="11" fill="#6e6e73">${esc(shortLabel(d.name,18))}</text>`;
  });
  s+=`<polygon points="${pts("a")}" fill="rgba(0,113,227,.11)" stroke="#0071e3" stroke-width="2.5"/>`;
  s+=`<polygon points="${pts("b")}" fill="rgba(175,82,222,.10)" stroke="#af52de" stroke-width="2.5"/>`;
  data.forEach((d,i)=>{
    if(d.a!==null){const [x,y]=pt(i,d.a);s+=`<circle cx="${x}" cy="${y}" r="3.8" fill="#0071e3" stroke="#fff" stroke-width="1.5"/>`;}
    if(d.b!==null){const [x,y]=pt(i,d.b);s+=`<circle cx="${x}" cy="${y}" r="3.8" fill="#af52de" stroke="#fff" stroke-width="1.5"/>`;}
  });
  s+=`<g font-family="-apple-system,BlinkMacSystemFont,Inter,sans-serif">
    <text x="20" y="24" font-size="11" fill="#6e6e73">0–10 compatibility scale</text>
  </g></svg>`;
  return s + `<div class="chart-legend"><span><i class="legend-dot legend-alya"></i>${esc(compareA||"Person 1")}</span><span><i class="legend-dot legend-puterI"></i>${esc(compareB||"Person 2")}</span></div>`;
}
function trendRows(){
  const t=db["Monthly Trend"]?.rows||[];
  return t.filter(r=>Array.isArray(r) && String(r[0]??"").trim());
}
function trendFor(name){
  const rows=trendRows();
  if(!rows.length)return [];
  const headers=db["Monthly Trend"]?.headers||[];
  const nameCol=headers.findIndex(h=>String(h??"").trim().toLowerCase()===String(name??"").trim().toLowerCase());
  if(nameCol<0)return [];
  return rows.map(r=>({period:String(r[0]??"").trim(), value:valNum(r[nameCol])})).filter(x=>x.value!==null);
}
function scenarioRowsForCompare(){
  const rows=db["Scenario Study"]?.rows||[];
  const headers=db["Scenario Study"]?.headers||[];
  const ai=headers.findIndex(h=>String(h??"").trim().toLowerCase()===String(compareA??"").trim().toLowerCase());
  const bi=headers.findIndex(h=>String(h??"").trim().toLowerCase()===String(compareB??"").trim().toLowerCase());
  if(ai<0 && bi<0)return [];
  return rows.map(r=>({
    scenario:String(r[1]??r[0]??"").trim(),
    a:ai>=0?valNum(r[ai]):null,
    b:bi>=0?valNum(r[bi]):null
  })).filter(x=>x.scenario && (x.a!==null || x.b!==null));
}
function buildForecast(values){
  const complete=values.filter(x=>x.a!==null&&x.b!==null);
  const currentA=complete.length?avg(complete.map(x=>x.a)):null;
  const currentB=complete.length?avg(complete.map(x=>x.b)):null;
  const avgGap=complete.length?avg(complete.map(x=>Math.abs(x.a-x.b))):null;

  // Prefer real Monthly Trend data when it exists.
  const ta=trendFor(compareA), tb=trendFor(compareB);
  function projected(series){
    if(series.length<2)return null;
    const vals=series.slice(-6);
    const first=vals[0].value, last=vals[vals.length-1].value;
    return Math.max(0,Math.min(10,last + (last-first)/Math.max(1,vals.length-1)));
  }
  let projA=projected(ta), projB=projected(tb);
  let source="Monthly Trend";
  if(projA===null && currentA!==null){projA=currentA; source="current-score baseline";}
  if(projB===null && currentB!==null){projB=currentB; source=source==="Monthly Trend"?"mixed data":"current-score baseline";}
  const scenarios=scenarioRowsForCompare();
  let scenarioAvgA=null,scenarioAvgB=null;
  const scA=scenarios.filter(x=>x.a!==null).map(x=>x.a);
  const scB=scenarios.filter(x=>x.b!==null).map(x=>x.b);
  if(scA.length)scenarioAvgA=avg(scA);
  if(scB.length)scenarioAvgB=avg(scB);

  return {currentA,currentB,avgGap,projA,projB,source,scenarios,scenarioAvgA,scenarioAvgB};
}
function forecastPanel(values){
  const f=buildForecast(values);
  if(f.currentA===null && f.currentB===null){
    return `<div class="empty">Add score data for the selected pair to generate forecast analysis.</div>`;
  }
  const shownA=f.projA===null?"—":f.projA.toFixed(1);
  const shownB=f.projB===null?"—":f.projB.toFixed(1);
  const shared=f.avgGap===null?null:Math.max(0,100-f.avgGap*10);
  const scenario=f.scenarios.slice(0,5);
  return `<div>
    <div class="forecast-grid">
      <div class="forecast-metric"><div class="label">Current ${esc(compareA)}</div><div class="value">${f.currentA===null?"—":f.currentA.toFixed(1)}</div></div>
      <div class="forecast-metric"><div class="label">Current ${esc(compareB)}</div><div class="value">${f.currentB===null?"—":f.currentB.toFixed(1)}</div></div>
      <div class="forecast-metric"><div class="label">Agreement index</div><div class="value">${shared===null?"—":shared.toFixed(0)+"%"}</div></div>
    </div>
    <div style="margin-top:18px;font-size:13px;font-weight:650">Projected baseline</div>
    <div class="forecast-row"><div>${esc(compareA)}</div><div class="bar"><div class="fill" style="width:${f.projA===null?0:(f.projA/10*100)}%;background:#0071e3"></div></div><div>${shownA}/10</div></div>
    <div class="forecast-row"><div>${esc(compareB)}</div><div class="bar"><div class="fill" style="width:${f.projB===null?0:(f.projB/10*100)}%;background:#af52de"></div></div><div>${shownB}/10</div></div>
    ${scenario.length?`<div style="margin-top:20px;font-size:13px;font-weight:650">Scenario resilience</div>
      <div class="scenario-list">${scenario.map(x=>`<div class="scenario-item"><div class="title">${esc(x.scenario)}</div><div class="scores">${esc(compareA)}: ${x.a===null?"—":x.a+"/10"} &nbsp;•&nbsp; ${esc(compareB)}: ${x.b===null?"—":x.b+"/10"}</div></div>`).join("")}</div>`:""}
    <div class="forecast-footnote">
      Forecast is a simple analytical baseline, not a prediction of relationship outcomes.
      ${esc(f.source)} is used when available. With insufficient trend history, the current score average is carried forward as the baseline.
    </div>
  </div>`;
}

function drawDashboardAnalytics(){
  if(activeTab!=="Dashboard") return;
  const at=document.getElementById("analyticsText");
  if(!at)return;
  const names=profileNamesEnhanced();
  const name=dashboardProfileName&&names.includes(dashboardProfileName)?dashboardProfileName:names[0];
  if(!name){at.innerHTML="<div class='empty'>Add a profile to generate analytics.</div>";return;}
  const data=profileSpiderData(name).filter(x=>x.value!==null);
  if(!data.length){at.innerHTML=`<div class='empty'>No score data is available for ${esc(name)} yet.</div>`;return;}
  const ranked=[...data].sort((a,b)=>b.value-a.value);
  const strengths=ranked.slice(0,3);
  const gaps=ranked.length>1?[...ranked].sort((a,b)=>a.value-b.value).slice(0,3):[];
  at.innerHTML=`<div class="analytics"><div class="insight"><div class="title">Selected profile</div><div class="text">${esc(name)}</div></div><div class="insight"><div class="title">Top strengths</div><div class="text">${strengths.map(x=>esc(x.name)+" ("+x.value+")").join(" · ")}</div></div><div class="insight"><div class="title">Focus areas</div><div class="text">${gaps.map(x=>esc(x.name)+" ("+x.value+")").join(" · ")}</div></div></div>`;
}

function chartData(){
  const spider = db["Spider Chart Data"]?.rows || [];
  const out = [];
  spider.forEach(r=>{
    const name = String(r?.[0] ?? "").trim();
    const a = valNum(r?.[1]);
    const p = valNum(r?.[2]);
    if(name && (a!==null || p!==null)) out.push({name,a,p});
  });
  return out;
}
function shortLabel(s,n=14){
  s=String(s||"");
  return s.length>n ? s.slice(0,n-1)+"…" : s;
}
function renderRadarSVG(data){
  const el=document.getElementById("radarChart");
  if(!el) return;
  if(!data.length){
    el.innerHTML="<div class='empty' style='padding:40px;text-align:center'>Enter scores in Spider Chart Data to display the chart.</div>";
    return;
  }
  const w=720,h=390,cx=360,cy=190,R=128;
  const n=data.length;
  const ring=[2,4,6,8,10];
  const angle=i=>(-Math.PI/2)+(i*2*Math.PI/n);
  const pt=(i,v)=>{
    const a=angle(i), rr=R*(v/10);
    return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)];
  };
  const polyPts=(v)=>data.map((_,i)=>pt(i,v)).map(p=>p.join(",")).join(" ");
  const dataPts=(key)=>data.map((d,i)=>pt(i,d[key]??0)).map(p=>p.join(",")).join(" ");
  let s=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Relationship compatibility spider chart">`;
  s+=`<rect width="100%" height="100%" fill="transparent"/>`;
  // grid
  ring.forEach(v=>{
    s+=`<polygon points="${polyPts(v)}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="${v===10?1.2:1}"/>`;
  });
  // spokes + labels
  data.forEach((d,i)=>{
    const [x,y]=pt(i,10);
    const [lx,ly]=pt(i,11.2);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(0,0,0,.07)" stroke-width="1"/>`;
    let anchor="middle";
    if(lx<cx-10) anchor="end";
    if(lx>cx+10) anchor="start";
    const dy=ly<cy?0:5;
    s+=`<text x="${lx}" y="${ly+dy}" text-anchor="${anchor}" font-size="11" fill="#6e6e73">${esc(shortLabel(d.name,16))}</text>`;
  });
  // scale labels
  ring.forEach(v=>{
    const [x,y]=pt(0,v);
    s+=`<text x="${x+6}" y="${y-3}" font-size="9" fill="#86868b">${v}</text>`;
  });
  // datasets
  s+=`<polygon points="${dataPts("a")}" fill="rgba(0,113,227,.12)" stroke="#0071e3" stroke-width="2.4" stroke-linejoin="round"/>`;
  s+=`<polygon points="${dataPts("p")}" fill="rgba(175,82,222,.10)" stroke="#af52de" stroke-width="2.4" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{
    if(d.a!==null){let [x,y]=pt(i,d.a);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="#0071e3" stroke="#fff" stroke-width="1.5"/>`;}
    if(d.p!==null){let [x,y]=pt(i,d.p);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="#af52de" stroke="#fff" stroke-width="1.5"/>`;}
  });
  s+=`</svg>`;
  el.innerHTML=s+`<div class="chart-legend"><span><i class="legend-dot legend-alya"></i>Alya</span><span><i class="legend-dot legend-puterI"></i>Puteri</span></div>`;
}
function renderBarSVG(data){
  const el=document.getElementById("barChart");
  if(!el) return;
  if(!data.length){
    el.innerHTML="<div class='empty' style='padding:40px;text-align:center'>Enter scores in Spider Chart Data to display the chart.</div>";
    return;
  }
  const w=720,h=390,left=48,right=18,top=24,bottom=78;
  const innerW=w-left-right, innerH=h-top-bottom;
  const max=10, groupW=innerW/data.length, barGap=5, bw=Math.min(20,(groupW-18)/2);
  let s=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Relationship compatibility bar chart">`;
  // grid + y labels
  [0,2,4,6,8,10].forEach(v=>{
    const y=top+innerH-(v/max)*innerH;
    s+=`<line x1="${left}" y1="${y}" x2="${w-right}" y2="${y}" stroke="rgba(0,0,0,.08)" stroke-width="1"/>`;
    s+=`<text x="${left-10}" y="${y+4}" text-anchor="end" font-size="10" fill="#86868b">${v}</text>`;
  });
  s+=`<line x1="${left}" y1="${top}" x2="${left}" y2="${top+innerH}" stroke="rgba(0,0,0,.10)"/>`;
  s+=`<line x1="${left}" y1="${top+innerH}" x2="${w-right}" y2="${top+innerH}" stroke="rgba(0,0,0,.10)"/>`;
  data.forEach((d,i)=>{
    const center=left+groupW*i+groupW/2;
    const ax=center-bw-barGap/2;
    const px=center+barGap/2;
    const ah=d.a==null?0:(d.a/max)*innerH;
    const ph=d.p==null?0:(d.p/max)*innerH;
    if(d.a!=null){
      const y=top+innerH-ah;
      s+=`<rect x="${ax}" y="${y}" width="${bw}" height="${ah}" rx="6" fill="#0071e3"/>`;
      s+=`<text x="${ax+bw/2}" y="${Math.max(14,y-6)}" text-anchor="middle" font-size="10" fill="#1d1d1f">${d.a}</text>`;
    }
    if(d.p!=null){
      const y=top+innerH-ph;
      s+=`<rect x="${px}" y="${y}" width="${bw}" height="${ph}" rx="6" fill="#af52de"/>`;
      s+=`<text x="${px+bw/2}" y="${Math.max(14,y-6)}" text-anchor="middle" font-size="10" fill="#1d1d1f">${d.p}</text>`;
    }
    const label=shortLabel(d.name,12);
    s+=`<text x="${center}" y="${top+innerH+22}" text-anchor="middle" font-size="10" fill="#6e6e73">${esc(label)}</text>`;
  });
  s+=`</svg>`;
  el.innerHTML=s+`<div class="chart-legend"><span><i class="legend-dot legend-alya"></i>Alya</span><span><i class="legend-dot legend-puterI"></i>Puteri</span></div>`;
}
function drawCharts(){
  if(activeTab!=="Dashboard") return;
  const data=chartData();
  renderRadarSVG(data);
  renderBarSVG(data);

  const at=document.getElementById("analyticsText");
  if(!at)return;
  const complete=data.filter(x=>x.a!==null&&x.p!==null);
  if(!complete.length){
    at.innerHTML="<div class='empty'>Complete both Alya and Puteri scores for at least one category to generate analytics.</div>";
    return;
  }
  const gaps=complete.map(x=>({name:x.name,gap:Math.abs(x.a-x.p),avg:(x.a+x.p)/2})).sort((a,b)=>b.gap-a.gap);
  const strengths=[...gaps].sort((a,b)=>b.avg-a.avg).slice(0,3);
  const priorities=[...gaps].slice(0,3);
  const agreement=100-(gaps.reduce((s,x)=>s+x.gap,0)/gaps.length)*10;
  at.innerHTML=`<div class="analytics">
    <div class="insight"><div class="title">Agreement index</div><div class="text">${Math.max(0,agreement).toFixed(0)}%</div></div>
    <div class="insight"><div class="title">Shared strengths</div><div class="text">${strengths.map(x=>esc(x.name)).join(" · ")}</div></div>
    <div class="insight"><div class="title">Largest gaps</div><div class="text">${priorities.map(x=>esc(x.name)+" ("+x.gap.toFixed(1)+")").join(" · ")}</div></div>
  </div>`;
}

function svgSingleProfileBars(name){

function svgMultiCompare(series){
  const valid=series.filter(s=>s.values.some(x=>x.value!==null));
  if(!valid.length)return `<div class="empty" style="padding:55px;text-align:center">Select at least one profile with score data.</div>`;
  const categories=[...new Set(valid.flatMap(s=>s.values.map(x=>x.name)))];
  const n=categories.length,w=820,h=470,cx=410,cy=225,R=160;
  const palette=["#0071e3","#af52de","#34c759"];
  const angle=i=>(-Math.PI/2)+(i*2*Math.PI/n);
  const valueFor=(series,cat)=>{const x=series.values.find(v=>v.name===cat);return x?.value??0;};
  const pt=(i,v,rr=R)=>{const a=angle(i),r=rr*(Math.max(0,Math.min(10,v))/10);return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const poly=v=>categories.map((_,i)=>pt(i,v)).map(p=>p.join(",")).join(" ");
  let svg=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;
  [2,4,6,8,10].forEach(v=>svg+=`<polygon points="${poly(v)}" fill="none" stroke="rgba(0,0,0,.08)"/>`);
  categories.forEach((cat,i)=>{const [x,y]=pt(i,10),[lx,ly]=pt(i,11.3);let anchor="middle";if(lx<cx-16)anchor="end";if(lx>cx+16)anchor="start";svg+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(0,0,0,.06)"/><text x="${lx}" y="${ly+4}" text-anchor="${anchor}" font-size="11" fill="#6e6e73">${esc(shortLabel(cat,18))}</text>`;});
  valid.forEach((ser,si)=>{const pts=categories.map((cat,i)=>pt(i,valueFor(ser,cat))).map(p=>p.join(",")).join(" ");svg+=`<polygon points="${pts}" fill="${palette[si]}18" stroke="${palette[si]}" stroke-width="3" stroke-linejoin="round"/>`;categories.forEach((cat,i)=>{const v=valueFor(ser,cat),[x,y]=pt(i,v);svg+=`<circle cx="${x}" cy="${y}" r="4.5" fill="${palette[si]}" stroke="#fff" stroke-width="2"><title>${esc(ser.name)} • ${esc(cat)}: ${v}/10</title></circle>`;});});
  svg+=`</svg>`;return svg+`<div class="compare-dataset-legend">${valid.map((s,i)=>`<span><i style="background:${palette[i]}"></i>${esc(s.name)}</span>`).join("")}</div>`;
}
function setMultiCompare(index,name){
  if(!name){comparePeople[index]="";}
  else{
    comparePeople[index]=name;
    const dedup=[];
    comparePeople.forEach(x=>{if(x&&!dedup.includes(x))dedup.push(x);});
    while(dedup.length<3)dedup.push("");
    comparePeople=dedup.slice(0,3);
  }
  db.__comparison=db.__comparison||{};db.__comparison.multi=comparePeople;
  render();
}
function openComparisonWith(name){
  const names=profileNamesEnhanced().filter(n=>n!==name);
  comparePeople=[name,names[0]||"",names[1]||""];
  db.__comparison=db.__comparison||{};db.__comparison.multi=comparePeople;
  activeTab="Comparison";render();
}
function comparisonPage(){
  const names=profileNamesEnhanced();
  const saved=db.__comparison?.multi||[];
  if(!comparePeople.length){comparePeople=[saved[0]||names[0]||"",saved[1]||names[1]||"",saved[2]||names[2]||""];}
  comparePeople=comparePeople.map((x,i)=>names.includes(x)?x:(i<2?(names[i]||""):""));
  const series=multiProfileSeries();
  const scored=series.map(s=>({name:s.name,avg:avg(s.values.map(x=>x.value).filter(v=>v!==null))}));
  const optionsFor=sel=>`<option value="">Select person ${sel+1}</option>`+names.map(n=>`<option value="${esc(n)}" ${n===comparePeople[sel]?"selected":""}>${esc(n)}</option>`).join("");
  return `<div class="card">
    <h2>Compare Profiles</h2>
    <div class="section-note">Compare 2 or 3 people at the same time. The chart uses each selected person's own profile scores.</div>
    <div class="multi-compare-grid">
      ${[0,1,2].map(i=>`<div class="compare-person"><div class="small">Person ${i+1}</div><select onchange="setMultiCompare(${i},this.value)" ${names.length<2&&i>0?"disabled":""}>${optionsFor(i)}</select></div>`).join("")}
    </div>
    <div class="grid kpis" style="margin-bottom:18px">
      ${[0,1,2].map(i=>{const x=scored[i];return `<div class="kpi"><div class="label">${esc(x?.name||"Person "+(i+1))}</div><div class="value">${x?.avg==null?"—":x.avg.toFixed(1)+"/10"}</div></div>`}).join("")}
      <div class="kpi"><div class="label">Profiles compared</div><div class="value">${series.length}</div></div>
    </div>
    <div class="card" style="margin:0">
      <h2>Multi-Profile Graph</h2>
      <div class="multi-compare-chart">${svgMultiCompare(series)}</div>
      <div class="interactive-tip">Hover over data points for the category and score.</div>
    </div>
    <div class="card" style="margin-top:18px">
      <h2>Comparison Snapshot</h2>
      <div class="table-wrap"><table class="compare-table"><thead><tr><th>Category</th>${series.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${[...new Set(series.flatMap(s=>s.values.map(x=>x.name)))].map(cat=>`<tr><td>${esc(cat)}</td>${series.map(s=>{const v=s.values.find(x=>x.name===cat)?.value;return `<td class="compare-score">${v==null?"—":v}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>
    </div>
  </div>`;
}

ensureProfileColumnsForAll();


render();
setTimeout(drawDashboardAnalytics,80);
</script>
<script>
// ===== Firebase configuration =====
// Replace these placeholder values with the Web App config from your Firebase console.
// The web config is meant to be used by client-side Firebase apps; data protection comes from Auth + Firestore Security Rules.
window.FIREBASE_CONFIG = {
  apiKey: "REPLACE_WITH_FIREBASE_API_KEY",
  authDomain: "REPLACE_WITH_FIREBASE_AUTH_DOMAIN",
  projectId: "REPLACE_WITH_FIREBASE_PROJECT_ID",
  storageBucket: "REPLACE_WITH_FIREBASE_STORAGE_BUCKET",
  messagingSenderId: "REPLACE_WITH_FIREBASE_MESSAGING_SENDER_ID",
  appId: "REPLACE_WITH_FIREBASE_APP_ID"
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const cfg = window.FIREBASE_CONFIG || {};
const isConfigured = cfg.apiKey && !String(cfg.apiKey).startsWith("REPLACE_") && cfg.projectId && !String(cfg.projectId).startsWith("REPLACE_");
let firebaseAuth = null;
let firestore = null;
let currentFirebaseUser = null;

window.firebaseReady = false;
window.firebaseConfigured = isConfigured;

function msg(text, kind=""){
  const el=document.getElementById("firebaseAuthMessage");
  if(!el)return;
  el.textContent=text||"";
  el.className="auth-message"+(kind?" "+kind:"");
}

function updateAuthUI(user){
  const dot=document.getElementById("authDot");
  const state=document.getElementById("authState");
  const email=document.getElementById("authEmail");
  const login=document.getElementById("loginButton");
  const logout=document.getElementById("logoutButton");
  const gate=document.getElementById("firebaseAuthGate");
  currentFirebaseUser=user||null;
  if(dot)dot.classList.toggle("online",!!user);
  if(state)state.textContent=user?"Firebase online":(isConfigured?"Signed out":"Local mode");
  if(email)email.textContent=user?(user.email||""):"";
  if(login)login.style.display=(user||!isConfigured)?"inline-flex":"none";
  if(logout)logout.style.display=user?"inline-flex":"none";
  if(gate)gate.classList.toggle("open",!!isConfigured && !user);
}

async function loadCloud(user){
  if(!firestore||!user)return;
  try{
    const snap=await getDoc(doc(firestore,"dashboards",user.uid));
    if(!snap.exists()){
      msg("Signed in. No cloud dashboard has been saved for this account yet.","ok");
      return;
    }
    const remote=snap.data()?.dashboard;
    const looksValid=typeof hasUsableDashboardData==="function" && hasUsableDashboardData(remote);
    if(looksValid){
      db=remote;
      db.__profilePhotos=db.__profilePhotos||{};
      db.__comparison=db.__comparison||{};
      localStorage.setItem("relationshipDashboardData",JSON.stringify(db));
      if(typeof ensureProfileColumnsForAll === "function") ensureProfileColumnsForAll();
      render();
      setTimeout(()=>{ if(typeof drawCharts === "function") drawCharts(); },80);
      msg("Cloud dashboard loaded.","ok");
    }
  }catch(err){
    console.error("Firebase cloud load failed",err);
    msg("Cloud load failed: "+(err?.message||err),"error");
  }
}

window.firebaseCloudSave = async function(silent=false){
  if(!isConfigured || !firestore || !currentFirebaseUser){
    if(!silent)msg(isConfigured?"Please sign in before saving online.":"Firebase is not configured yet. The dashboard remains available in local mode.","error");
    return false;
  }
  try{
    const payload=JSON.parse(JSON.stringify(db));
    // Keep account-specific data in one user-owned document.
    await setDoc(doc(firestore,"dashboards",currentFirebaseUser.uid),{
      dashboard:payload,
      updatedAt:serverTimestamp(),
      ownerUid:currentFirebaseUser.uid
    },{merge:true});
    if(!silent)msg("Saved to Firebase.","ok");
    return true;
  }catch(err){
    console.error("Firebase save failed",err);
    if(!silent)msg("Firebase save failed: "+(err?.message||err),"error");
    return false;
  }
};

window.firebaseLogin = async function(){
  if(!firebaseAuth){msg("Firebase has not been configured yet.","error");return;}
  const email=document.getElementById("firebaseEmail")?.value.trim();
  const password=document.getElementById("firebasePassword")?.value||"";
  if(!email||!password){msg("Enter both email and password.","error");return;}
  try{
    msg("Signing in…");
    await signInWithEmailAndPassword(firebaseAuth,email,password);
    msg("Signed in.","ok");
  }catch(err){
    msg(err?.message||"Sign in failed.","error");
  }
};
window.firebaseRegister = async function(){
  if(!firebaseAuth){msg("Firebase has not been configured yet.","error");return;}
  const email=document.getElementById("firebaseEmail")?.value.trim();
  const password=document.getElementById("firebasePassword")?.value||"";
  if(!email||!password){msg("Enter an email and password.","error");return;}
  if(password.length<6){msg("Password must be at least 6 characters.","error");return;}
  try{
    msg("Creating account…");
    await createUserWithEmailAndPassword(firebaseAuth,email,password);
    msg("Account created.","ok");
  }catch(err){
    msg(err?.message||"Account creation failed.","error");
  }
};
window.firebaseLogout = async function(){
  if(!firebaseAuth)return;
  await signOut(firebaseAuth);
};
window.openFirebaseLogin = function(){
  const gate=document.getElementById("firebaseAuthGate");
  if(!isConfigured){
    alert("Firebase is not configured yet. Add your Firebase Web App configuration to FIREBASE_CONFIG in the HTML.");
    return;
  }
  gate?.classList.add("open");
};

if(isConfigured){
  try{
    const app=initializeApp(cfg);
    firebaseAuth=getAuth(app);
    firestore=getFirestore(app);
    window.firebaseReady=true;
    onAuthStateChanged(firebaseAuth, async user=>{
      updateAuthUI(user);
      if(user) await loadCloud(user);
    });
  }catch(err){
    console.error("Firebase initialization failed",err);
    updateAuthUI(null);
  }
}else{
  updateAuthUI(null);
}

// Replace the existing Save Data action with local + Firebase saving.
const originalSaveData = window.saveData;
window.saveData = async function(silent=false){
  try{ if(typeof originalSaveData === "function") originalSaveData(true); }catch(e){ console.warn(e); }
  if(!isConfigured || !currentFirebaseUser){
    if(!silent && typeof msg === "function") msg(isConfigured?"Saved locally. Sign in to save online.":"Saved locally. Firebase setup is still required for cloud saving.","ok");
    return;
  }
  await window.firebaseCloudSave(silent);
};
</script>

</body></html>
